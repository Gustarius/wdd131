<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="description" content="Create a product review form page ">
    <meta name="author" content="Urlin Gustave">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <p>Product Review</p>
    </header>
    <main>
        <form method="get" action="review.html" class="wf1">
            <label for="productName">Product Name
                <selct name="product" id="productName" required>
                    <option value+="" disabled selected>Select a product&#9662;</option> 
            <!-- <label>Product Name
                <select name="subject">
                    <option>Choose a Product &#9662;</option>
                    <option value="capacitor">Flux capacitor</option>
                    <option value="laces">Power Laces</option>
                    <option value="circuits">Time circuits</option>
                    <option value="voltage">Low voltage reactor</option>
                    <option value="equalizer">Warp equalizer</option>
                </select> -->
            </label>


            <div>Overall Rating</div>
            <label for="oneStar"><input type="radio" name="rating" id="oneStar" value="1" required>*</label>
            <label for="twoStar"><input type="radio" name="rating" id="twoStar" value="2" required>**</label>
            <label for="threeStar"><input type="radio" name="rating" id="threeStar" value="3" required>***</label>
            <label for="fourStar"><input type="radio" name="rating" id="fourStar" value="4" required>****</label>
            <label for="fiveStar"><input type="radio" name="rating" id="fiveStar" value="5" required>*****</label>

            <label>Date of Installation<input type="date" name="installationDate"></label>
                
            <div>Which features did you find useful in the product? (check all that apply)</div>
            <label><input type="checkbox"name="durability" value="yes">Durability</label>
            <label><input type="checkbox"name="useful" value="yes">Ease of use</label>
            <label><input type="checkbox"name="performance" value="yes">Performance</label>
            <label><input type="checkbox"name="design" value="yes">Design</label>

            <label for="review">Written Review (Optional)</label>
            <textarea id="review" name="review" rows="4"></textarea>

            <label for="name">Your Name (Optional)</label>
            <input type="text" id="name" name="name">

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p> © <span id="currentyear"></span> - Urlin Gustave - Cap-Haitian - Haiti</p>
        <p> <span id="lastModified"></span></p>
    </footer>

</body>
</html>
